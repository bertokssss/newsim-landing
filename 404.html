<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | NEWSIM Maritime Training</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:#07111c; color:#e2e8f0; font-family:Inter,system-ui,sans-serif; }
    .card { width:100%; max-width:500px; background:rgba(13,26,43,0.94); border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:36px 28px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,0.55); }
    .eyebrow { font-size:11px; letter-spacing:3px; text-transform:uppercase; font-weight:700; color:#38bdf8; margin:0 0 8px; }
    h1 { font-family:Sora,sans-serif; font-size:2rem; color:#fff; margin:0 0 12px; }
    p { font-size:14px; color:#cbd5e1; line-height:1.6; margin:0 0 24px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
    .btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:700; text-decoration:none; }
    .btn-gold { background:#d8c4a5; color:#07111c; }
    .btn-ghost { border:1px solid rgba(255,255,255,0.18); color:#f8fafc; background:rgba(255,255,255,0.05); }
  </style>
</head>
<body>
  <main class="card">
    <svg width="56" height="56" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="margin-bottom:14px">
      <rect width="64" height="64" rx="16" fill="#0F2035" stroke="#D8C4A5" stroke-opacity="0.35"/>
      <polygon points="32,12 12,50 32,40" fill="#D8C4A5"/>
      <polygon points="32,12 52,50 32,40" fill="#38BDF8"/>
    </svg>
    <p class="eyebrow">Navigation Alert &bull; 404</p>
    <h1>Page Not Found</h1>
    <p>The requested NEWSIM page could not be located. Return to our homepage or open your NEWSIM Trainee Portal.</p>
    <div class="actions">
      <a class="btn btn-gold" href="index.html">Back to Homepage</a>
      <a class="btn btn-ghost" href="/login" data-portal="trainee" data-portal-path="/login">Trainee Portal</a>
    </div>
  </main>
  <script src="js/portal-config.js" defer></script>
  <script src="js/portal-links.js" defer></script>
</body>
</html>
